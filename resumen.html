<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punku Open | Resúmenes con IA</title>
  <style>
    :root { --bg: #0d0d0d; --gold: #ffd700; --card: #1a1a1a; --border: #444; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #e0e0e0; margin: 0; padding-bottom: 50px; }
    header { background: #111; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); }
    header h1 { color: var(--gold); margin: 0; font-size: 2.5rem; }
    header p { color: #aaa; margin: 5px 0 0; }
    .btn-volver { background: #444; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn-volver:hover { background: #555; }
    main { max-width: 800px; margin: 30px auto; background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #ccc; }
    select, input, textarea { width: 100%; padding: 12px; background: #252525; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--gold); }
    textarea { resize: vertical; min-height: 250px; font-family: 'Segoe UI', sans-serif; font-size: 0.95rem; line-height: 1.8; background: #0d0d0d; }
    .btn-main { background: var(--gold); color: black; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1rem; text-transform: uppercase; transition: all 0.3s; }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3); }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #resultadoArea { margin-top: 30px; display: none; border-top: 1px solid var(--border); padding-top: 20px; }
    .grid-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
    .btn-action { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; text-align: center; text-decoration: none; font-size: 0.85rem; transition: all 0.3s; }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
    .btn-copy { background: #555; }
    .btn-wa { background: #25d366; }
    .btn-pdf { background: #dc3545; }
    .btn-save { background: #17a2b8; }
    .btn-gpt { background: #10a37f; }
    .btn-gemini { background: #4285f4; }
    #loading { text-align: center; padding: 30px; display: none; }
    .spinner { border: 4px solid #252525; border-top: 4px solid var(--gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loading p { color: #aaa; }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; font-weight: bold; display: none; z-index: 1000; }
    @media (max-width: 600px) { header h1 { font-size: 1.8rem; } main { padding: 20px; } .grid-btns { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

<header>
  <h1>📚 Punku Open</h1>
  <p>Resúmenes con Inteligencia Artificial para el Magisterio</p>
  <button class="btn-volver" onclick="location.href='index.html'">⬅ Volver al inicio</button>
</header>

<main>
  <!-- Tipo de Recurso -->
  <div class="form-group">
    <label>Tipo de Recurso:</label>
    <select id="tipoRecurso">
      <option value="libro">📘 Obra Literaria / Libro</option>
      <option value="enlace">🌐 Artículo Web / Noticia</option>
    </select>
  </div>

  <!-- Sección Libro -->
  <div id="seccionLibro">
    <div class="form-group"><input type="text" id="tituloLibro" placeholder="Título de la obra"></div>
    <div class="form-group"><input type="text" id="autorLibro" placeholder="Autor (opcional)"></div>
  </div>

  <!-- Sección Enlace -->
  <div id="seccionEnlace" style="display: none;">
    <div class="form-group"><input type="url" id="urlWeb" placeholder="https://enlace-del-articulo.com"></div>
  </div>

  <!-- Extensión -->
  <div class="form-group">
    <label>Extensión del resumen:</label>
    <select id="longitudResumen">
      <option value="250">Sintético (250 palabras)</option>
      <option value="500" selected>Estándar (500 palabras)</option>
      <option value="850">Profundo (850 palabras)</option>
      <option value="1200">Extenso (1200 palabras)</option>
    </select>
  </div>

  <!-- Botón Generar -->
  <button class="btn-main" id="btnGenerar" onclick="generarPromptResumen()">✨ Generar Resumen con IA</button>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p>⏳ Generando resumen... Esto puede tomar unos segundos</p>
  </div>

  <!-- Resultado -->
  <div id="resultadoArea">
    <label>📝 Resumen Generado:</label>
    <textarea id="promptOutput" readonly></textarea>
    
    <div class="grid-btns">
      <button class="btn-action btn-copy" onclick="copiarPrompt()">📋 Copiar</button>
      <button class="btn-action btn-wa" onclick="enviarWhatsApp()">🟢 WhatsApp</button>
      <button class="btn-action btn-pdf" onclick="exportarPDF()">📄 PDF</button>
      <button class="btn-action btn-save" onclick="guardarPrompt()">💾 Guardar</button>
      <a href="https://chat.openai.com/" target="_blank" class="btn-action btn-gpt">🤖 ChatGPT</a>
      <a href="https://gemini.google.com/" target="_blank" class="btn-action btn-gemini">💎 Gemini</a>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
// ============================================================
// CONFIGURACIÓN - Hugging Face API (100% GRATIS)
// ============================================================
const HF_API_KEY = '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';
const HF_API_URL = 'https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.1';

// ============================================================
// ELEMENTOS DOM
// ============================================================
const tipoRecurso = document.getElementById('tipoRecurso');
const seccionLibro = document.getElementById('seccionLibro');
const seccionEnlace = document.getElementById('seccionEnlace');
const tituloLibro = document.getElementById('tituloLibro');
const autorLibro = document.getElementById('autorLibro');
const urlWeb = document.getElementById('urlWeb');
const longitudResumen = document.getElementById('longitudResumen');
const promptOutput = document.getElementById('promptOutput');
const resultadoArea = document.getElementById('resultadoArea');
const btnGenerar = document.getElementById('btnGenerar');
const loading = document.getElementById('loading');
const toast = document.getElementById('toast');

// ============================================================
// MANEJO DE VISIBILIDAD (Libro / Enlace)
// ============================================================
tipoRecurso.addEventListener('change', function() {
    const esLibro = this.value === 'libro';
    seccionLibro.style.display = esLibro ? 'block' : 'none';
    seccionEnlace.style.display = esLibro ? 'none' : 'block';
    
    if (esLibro) {
        urlWeb.value = '';
    } else {
        tituloLibro.value = '';
        autorLibro.value = '';
    }
});

// ============================================================
// GENERAR RESUMEN CON IA
// ============================================================
async function generarPromptResumen() {
    const tipo = tipoRecurso.value;
    const palabras = parseInt(longitudResumen.value);
    
    // Validar campos
    if (tipo === 'libro') {
        const t = tituloLibro.value.trim();
        if (!t) {
            mostrarToast('⚠️ Ingresa el título del libro', '#ff6b6b');
            tituloLibro.focus();
            return;
        }
    } else {
        const u = urlWeb.value.trim();
        if (!u) {
            mostrarToast('⚠️ Ingresa la URL del artículo', '#ff6b6b');
            urlWeb.focus();
            return;
        }
    }
    
    // Mostrar loading
    loading.style.display = 'block';
    btnGenerar.disabled = true;
    btnGenerar.textContent = '⏳ Generando...';
    resultadoArea.style.display = 'none';
    promptOutput.value = '';
    
    try {
        const prompt = construirPrompt(tipo, palabras);
        const resumen = await llamarHuggingFace(prompt);
        
        promptOutput.value = resumen;
        resultadoArea.style.display = 'block';
        resultadoArea.scrollIntoView({ behavior: 'smooth' });
        mostrarToast('✅ ¡Resumen generado exitosamente!');
        
    } catch (error) {
        console.error('Error:', error);
        mostrarToast('❌ Error: ' + error.message, '#ff6b6b');
    } finally {
        loading.style.display = 'none';
        btnGenerar.disabled = false;
        btnGenerar.textContent = '✨ Generar Resumen con IA';
    }
}

// ============================================================
// CONSTRUIR PROMPT PARA LA IA
// ============================================================
function construirPrompt(tipo, palabras) {
    let prompt = `<s>[INST] Eres un experto en educación y pedagogía. `;
    
    if (tipo === 'libro') {
        const titulo = tituloLibro.value.trim();
        const autor = autorLibro.value.trim();
        prompt += `Genera un resumen académico de aproximadamente ${palabras} palabras sobre la obra "${titulo}"`;
        if (autor) {
            prompt += ` del autor ${autor}`;
        }
        prompt += `. El resumen debe incluir: contexto histórico y literario, análisis de la trama, temas principales, personajes clave y su relevancia educativa.`;
    } else {
        const url = urlWeb.value.trim();
        prompt += `Genera un resumen analítico de aproximadamente ${palabras} palabras del artículo disponible en: ${url}. `;
        prompt += `Debes identificar: los argumentos principales, las evidencias presentadas, el contexto de publicación y la relevancia educativa del contenido.`;
    }
    
    prompt += ` El resumen debe ser profesional, estructurado en párrafos y útil para docentes. No incluyas saludos ni despedidas. [/INST]`;
    
    return prompt;
}

// ============================================================
// LLAMAR A HUGGING FACE API
// ============================================================
async function llamarHuggingFace(prompt) {
    const response = await fetch(HF_API_URL, {
        method: 'POST',
        headers: {
            'Authorization': `Bearer ${HF_API_KEY}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            inputs: prompt,
            parameters: {
                max_new_tokens: 1200,
                temperature: 0.7,
                top_p: 0.95,
                do_sample: true,
                return_full_text: false
            }
        })
    });
    
    if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || 'Error en la API de Hugging Face');
    }
    
    const data = await response.json();
    
    let texto = '';
    if (Array.isArray(data) && data.length > 0) {
        texto = data[0].generated_text || '';
    } else if (data.generated_text) {
        texto = data.generated_text;
    } else {
        texto = JSON.stringify(data);
    }
    
    texto = texto.replace(/<s>/g, '').replace(/<\/s>/g, '')
        .replace(/\[INST\]/g, '').replace(/\[\/INST\]/g, '')
        .trim();
    
    if (!texto) {
        throw new Error('No se pudo generar el resumen');
    }
    
    return texto;
}

// ============================================================
// COPIAR TEXTO
// ============================================================
async function copiarPrompt() {
    const texto = promptOutput.value;
    if (!texto) {
        mostrarToast('⚠️ No hay texto para copiar', '#ff6b6b');
        return;
    }
    
    try {
        await navigator.clipboard.writeText(texto);
        mostrarToast('✅ ¡Copiado al portapapeles!');
    } catch (err) {
        promptOutput.select();
        document.execCommand('copy');
        mostrarToast('✅ ¡Copiado al portapapeles!');
    }
}

// ============================================================
// ENVIAR POR WHATSAPP
// ============================================================
function enviarWhatsApp() {
    const texto = promptOutput.value;
    if (!texto) {
        mostrarToast('⚠️ No hay texto para compartir', '#ff6b6b');
        return;
    }
    
    const msg = encodeURIComponent(`📚 Punku Open - Resumen\n\n${texto}`);
    window.open(`https://wa.me/?text=${msg}`, '_blank');
}

// ============================================================
// GUARDAR COMO ARCHIVO .TXT
// ============================================================
function guardarPrompt() {
    const texto = promptOutput.value;
    if (!texto) {
        mostrarToast('⚠️ No hay texto para guardar', '#ff6b6b');
        return;
    }
    
    const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `resumen-punku-${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    mostrarToast('💾 ¡Resumen guardado!');
}

// ============================================================
// EXPORTAR A PDF
// ============================================================
function exportarPDF() {
    const texto = promptOutput.value;
    if (!texto) {
        mostrarToast('⚠️ No hay texto para exportar', '#ff6b6b');
        return;
    }
    
    const ventana = window.open('', '_blank');
    ventana.document.write(`
        <html>
            <head>
                <title>Resumen Punku Open</title>
                <style>
                    body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.8; }
                    h1 { color: #ffd700; border-bottom: 2px solid #ffd700; padding-bottom: 10px; }
                    .footer { margin-top: 30px; color: #888; font-size: 0.9em; border-top: 1px solid #ddd; padding-top: 10px; }
                    .content { white-space: pre-wrap; }
                </style>
            </head>
            <body>
                <h1>📚 Punku Open - Resumen</h1>
                <div class="content">${texto.replace(/\n/g, '<br>')}</div>
                <div class="footer">Generado el ${new Date().toLocaleDateString('es-PE')} - Punku Open</div>
                <script>
                    window.onload = function() { window.print(); }
                <\/script>
            </body>
        </html>
    `);
    ventana.document.close();
}

// ============================================================
// TOAST (NOTIFICACIONES)
// ============================================================
function mostrarToast(mensaje, color = '#ffd700') {
    toast.textContent = mensaje;
    toast.style.background = color;
    toast.style.display = 'block';
    toast.style.opacity = '1';
    
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 300);
    }, 3000);
}

// ============================================================
// EXPONER FUNCIONES GLOBALMENTE
// ============================================================
window.generarPromptResumen = generarPromptResumen;
window.copiarPrompt = copiarPrompt;
window.enviarWhatsApp = enviarWhatsApp;
window.guardarPrompt = guardarPrompt;
window.exportarPDF = exportarPDF;
</script>
</body>
</html>
