<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punku Open | Generador de Resúmenes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .header { background: linear-gradient(135deg, #111, #1a1a1a); padding: 30px 20px; text-align: center; border-bottom: 3px solid #ffd700; }
    .header h1 { color: #ffd700; font-size: 2.5rem; }
    .header p { color: #aaa; font-size: 1.1rem; margin-top: 5px; }
    .btn-volver { background: #444; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: background 0.3s; }
    .btn-volver:hover { background: #555; }
    .card { background: #1a1a1a; border-radius: 15px; padding: 30px; margin-top: 30px; border: 1px solid #444; }
    .card h2 { color: #ffd700; font-size: 1.5rem; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 2px solid #444; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; }
    .form-group select, .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; background: #252525; border: 2px solid #444; color: white; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; }
    .form-group select:focus, .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #ffd700; }
    .form-group textarea { resize: vertical; min-height: 250px; font-family: 'Segoe UI', sans-serif; line-height: 1.8; background: #0d0d0d; }
    .btn-generar { background: linear-gradient(135deg, #ffd700, #ffed4a); color: #000; padding: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 1.1rem; text-transform: uppercase; width: 100%; transition: all 0.3s; letter-spacing: 1px; }
    .btn-generar:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3); }
    .btn-generar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #loading { display: none; text-align: center; padding: 30px; }
    .spinner { border: 4px solid #252525; border-top: 4px solid #ffd700; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loading p { color: #aaa; }
    #resultado { display: none; margin-top: 20px; }
    #resultado label { color: #ffd700; font-size: 1.1rem; display: block; margin-bottom: 10px; }
    .grid-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
    .btn-action { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; color: white; text-align: center; font-size: 0.85rem; transition: all 0.3s; }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
    .btn-copy { background: #555; }
    .btn-wa { background: #25d366; }
    .btn-pdf { background: #dc3545; }
    .btn-save { background: #17a2b8; }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ffd700; color: #000; padding: 12px 25px; border-radius: 25px; font-weight: 700; display: none; z-index: 1000; }
    @media (max-width: 600px) { .header h1 { font-size: 1.8rem; } .card { padding: 20px; } .grid-btns { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

<div class="header">
  <h1>📚 Punku Open</h1>
  <p>Generador de Resúmenes con Inteligencia Artificial</p>
  <button class="btn-volver" onclick="window.location.href='/'">⬅ Volver al inicio</button>
</div>

<div class="container">
  <div class="card">
    <h2>✍️ Generar Resumen</h2>

    <div class="form-group">
      <label>Tipo de Recurso:</label>
      <select id="tipoRecurso">
        <option value="libro">📘 Obra Literaria / Libro</option>
        <option value="enlace">🌐 Artículo Web / Noticia</option>
      </select>
    </div>

    <div id="seccionLibro">
      <div class="form-group"><input type="text" id="tituloLibro" placeholder="Título de la obra"></div>
      <div class="form-group"><input type="text" id="autorLibro" placeholder="Autor (opcional)"></div>
    </div>

    <div id="seccionEnlace" style="display: none;">
      <div class="form-group"><input type="url" id="urlWeb" placeholder="https://ejemplo.com/articulo"></div>
    </div>

    <div class="form-group">
      <label>Extensión del resumen:</label>
      <select id="longitudResumen">
        <option value="250">Sintético (250 palabras)</option>
        <option value="500" selected>Estándar (500 palabras)</option>
        <option value="850">Profundo (850 palabras)</option>
        <option value="1200">Extenso (1200 palabras)</option>
      </select>
    </div>

    <button class="btn-generar" id="btnGenerar">✨ Generar Resumen con IA</button>

    <div id="loading">
      <div class="spinner"></div>
      <p>⏳ Generando resumen... Esto puede tomar unos segundos</p>
    </div>

    <div id="resultado">
      <label>📝 Resumen Generado:</label>
      <div class="form-group"><textarea id="resumenOutput" readonly></textarea></div>
      <div class="grid-btns">
        <button class="btn-action btn-copy" onclick="copiarResumen()">📋 Copiar</button>
        <button class="btn-action btn-wa" onclick="enviarWhatsApp()">🟢 WhatsApp</button>
        <button class="btn-action btn-pdf" onclick="exportarPDF()">📄 PDF</button>
        <button class="btn-action btn-save" onclick="guardarResumen()">💾 Guardar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="resumen.js?v=5"></script>
</body>
</html>
